name: Novarr
options:
  bundleIdPrefix: studio.visns
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: QSK3QCWCH2
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Novarr:
    type: application
    platform: iOS
    sources:
      - path: Novarr
    info:
      path: Novarr/App/Info.plist
      properties:
        CFBundleDisplayName: Novarr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIAppFonts:
          - geist_regular.ttf
          - geist_medium.ttf
          - geist_semibold.ttf
          - geist_mono_regular.ttf
          - literata_regular.ttf
          - literata_italic.ttf
          - literata_semibold.ttf
          - literata_bold.ttf
          - literata_bolditalic.ttf
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Kept on purpose: self-hosted servers are often plain http under any
        # name (LAN DNS, DDNS, port forwards). NSAllowsLocalNetworking only
        # covers IPs, .local and unqualified names, and setting it makes iOS
        # ignore NSAllowsArbitraryLoads, so it can't be added alongside.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Novarr connects to your Novarr server on your local network to load your library and chapters.
        # Audiobooks keep playing with the screen locked or the app in the
        # background; "fetch" lets iOS wake the app now and then to look for
        # new chapters and request news (local notifications, no push).
        UIBackgroundModes:
          - audio
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - studio.visns.novarr.refresh
        # "Open in Novarr" / the Share sheet for ePubs (sent to the owner's
        # approval queue) and audiobook files (uploaded). Copied into the
        # app's Inbox, never opened in place. No share extension (that would
        # need an App Group).
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: ePub book
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.idpf.epub-container
          - CFBundleTypeName: Audiobook file
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.audio
              - public.mp3
              - public.mpeg-4-audio
              - com.apple.m4a-audio
              - com.apple.protected-mpeg-4-audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.visns.novarr
        PRODUCT_NAME: Novarr
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  NovarrTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NovarrTests
    dependencies:
      - target: Novarr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.visns.novarr.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Novarr:
    build:
      targets:
        Novarr: all
        NovarrTests: [test]
    test:
      targets:
        - NovarrTests
      gatherCoverageData: false
    run:
      config: Debug
