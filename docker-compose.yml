# =============================================================================
# Novarr — clone-and-run stack
# =============================================================================
# Builds the image from this checkout and runs everything Novarr needs: the
# app (Octane serves PHP *and* static assets), a one-shot migration, the
# scheduler (which also drains the command queue), MySQL, Redis, and
# FlareSolverr for Cloudflare-protected scraping. No .env and no host
# dependencies beyond Docker:
#
#   git clone https://github.com/RaihaX/novarr.git && cd novarr
#   docker compose up -d --build
#
# Then open http://localhost/ (or http://<host>/). An APP_KEY is generated on
# first start and kept in the storage volume. All data lives in named volumes,
# so `docker compose down` keeps it and `docker compose down -v` deletes it.
#
# Optional settings, read from the shell or from a `.env` file next to this
# one (all have working defaults):
#   NOVARR_PORT          host port (default 80)
#   APP_URL              the origin you browse to, e.g. https://novarr.example
#   APP_TIMEZONE         default UTC
#   DB_PASSWORD, MYSQL_ROOT_PASSWORD   only applied when the MySQL volume is
#                        first created; the database port is never published
#   MAIL_MAILER, RESEND_KEY, MAIL_FROM_ADDRESS   daily summary / Send-to-Kindle
#   NOTIFICATION_WEBHOOK_URL
#
# Don't want to build? docker-compose.oneclick.yml runs the same stack from
# the prebuilt image, without cloning.
# =============================================================================

name: novarr

x-novarr-image: &novarr-image
  image: novarr:local
  build:
    context: .

x-app-env: &app-env
  APP_NAME: Novarr
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: ${APP_URL:-http://localhost}
  APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
  LOG_CHANNEL: stack
  # Daily files under storage/logs (14 kept) AND stderr, so errors show in
  # `docker compose logs`.
  LOG_STACK: daily,stderr
  LOG_DAILY_DAYS: "14"
  LOG_LEVEL: warning
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: novarr
  DB_USERNAME: novarr
  DB_PASSWORD: ${DB_PASSWORD:-novarr_secret}
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  QUEUE_CONNECTION: database
  QUEUE_FAILED_DRIVER: database-uuids
  OCTANE_SERVER: roadrunner
  FLARESOLVERR_URL: http://flaresolverr:8191/v1
  MAIL_MAILER: ${MAIL_MAILER:-log}
  RESEND_KEY: ${RESEND_KEY:-}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-novarr@example.com}
  NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-}

services:
  # One-shot: wait for MySQL, run migrations, then exit. Everything else waits
  # for this to finish so the schema is ready before the app/scheduler start.
  init:
    <<: *novarr-image
    environment: *app-env
    command: php artisan migrate --force
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  app:
    <<: *novarr-image
    environment: *app-env
    # Ensure the public/storage symlink exists in this container, then serve.
    command: sh -c "php artisan storage:link --force >/dev/null 2>&1 || true; exec php artisan octane:start --server=roadrunner --host=0.0.0.0 --port=8000"
    ports:
      - "${NOVARR_PORT:-80}:8000"
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # schedule:work runs the cron tasks (TOC refresh, chapter downloads,
  # completion verify, summary email, backups) AND drains the command queue
  # each minute.
  scheduler:
    <<: *novarr-image
    environment: *app-env
    command: php artisan schedule:work
    # Healthy while the every-minute heartbeat (routes/console.php) is under
    # 3 minutes old. --max-age is set out of reach so a long job backlog does
    # not count against the scheduler.
    healthcheck:
      test: ["CMD", "php", "artisan", "queue:health-check", "--heartbeat=3", "--max-age=525600"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: novarr
      MYSQL_USER: novarr
      MYSQL_PASSWORD: ${DB_PASSWORD:-novarr_secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      # Over TCP, not the socket: on first boot the image runs a temporary
      # socket-only server to create the database, and a socket ping reports
      # healthy while the port the app connects to is still closed.
      test: ["CMD", "mysqladmin", "ping", "--protocol=tcp", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_secret}"]
      interval: 5s
      timeout: 5s
      retries: 40
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    environment:
      LOG_LEVEL: info
    restart: unless-stopped

volumes:
  mysql:
  redis:
  storage:
