version: "2.7"

server:
  command: "php public/index.php"
  relay: pipes

http:
  address: 0.0.0.0:8000
  max_request_size: 100
  middleware:
    - gzip
    - static
  static:
    dir: "public"
    forbid: [".php", ".htaccess"]
  pool:
    num_workers: 4
    max_jobs: 64
    allocate_timeout: 60s
    destroy_timeout: 60s

logs:
  mode: production
  level: error
  encoding: json
  output: stdout

# No `reload:` file watcher here: `php artisan octane:start` passes this file
# to rr with -c, so a watcher would poll app/, config/ and routes/ every
# second in production too. For live reload in development run
# `php artisan octane:start --watch` (Octane's own watcher; needs Node and
# chokidar).

# Health check endpoint
status:
  address: 0.0.0.0:2114

# Metrics (optional - for monitoring)
# metrics:
#   address: 0.0.0.0:2112
